name: homelab

networks:
  homelab-network:
    name: homelab-network-default
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  frontend-network:
    name: homelab-network-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
  backend-network:
    name: homelab-network-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.20.0/24
  monitoring-network:
    name: homelab-network-monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.30.0/24

services:
  # --- DNS Server ---
  dnsmasq:
    image: jpillora/dnsmasq
    container_name: dnsmasq-${DNS_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=Europe/Paris
    ports:
      - "5053:53/udp"
    volumes:
      - ${DOCKER_DEPLOYMENT_PATH}/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
    networks:
      homelab-network:
        ipv4_address: 192.168.10.2
      frontend-network:
        ipv4_address: 172.16.10.2
      backend-network:
        ipv4_address: 172.16.20.2
      monitoring-network:
        ipv4_address: 172.16.30.2
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "traefik.docker.local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  pihole:
    container_name: pihole-${DNS_CONTAINER_NAME:-aistack}
    image: pihole/pihole:latest
    environment:
      TZ: 'Europe/Paris'
      WEBPASSWORD: 'your_password'
    volumes:
      - ./volumes/pihole:/etc/pihole
      - ${DOCKER_DEPLOYMENT_PATH}/dnsmasq:/etc/dnsmasq.d
    restart: unless-stopped

  traefik:
    image: "traefik:v3.3.5"
    container_name: traefik-${TRAEFIK_CONTAINER_NAME:-aistack}
    depends_on:
      - dnsmasq
      - pihole
    dns:
      - 192.168.10.2
    environment:
      - TZ=Europe/Paris
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --accesslog.fields.names.StartUTC=drop
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ${DOCKER_DEPLOYMENT_PATH}/traefik:/etc/traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`traefik.docker.local`)"
      - "traefik.http.routers.api.service=api@internal"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
      - homelab-network

  # --- Whoami Debugging Service ---
  whoami:
    image: traefik/whoami:${WHOAMI_DOCKER_TAG:-latest}
    container_name: whoami-${WHOAMI_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    depends_on:
      - dnsmasq
    dns:
      - 192.168.10.2
    networks:
      - backend-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami-http.entrypoints=web"
      - "traefik.http.routers.whoami-http.rule=Host(`whoami.docker.local`)"
      - "traefik.http.services.whoami-service.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami-http.service=whoami-service"
      - "traefik.docker.network=backend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Portainer --- 
  portainer:
    image: portainer/portainer-ce:${PORTAINER_DOCKER_TAG:-latest}
    container_name: portainer-${PORTAINER_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    depends_on:
      - dnsmasq
    dns:
      - 192.168.10.2
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
      - homelab-network
    ports:
      - "9000:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${DOCKER_VOLUMES_PATH}/portainer/data:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-http.entrypoints=web"
      - "traefik.http.routers.portainer-http.rule=Host(`portainer.docker.local`)"
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer-http.service=portainer-service"
      - "traefik.docker.network=frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:${NGINX_DOCKER_TAG:-latest}
    container_name: nginx-${NGINX_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    depends_on:
      - dnsmasq
    dns:
      - 192.168.10.2
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
      - homelab-network
    ports:
      - "${NGINX_PORT:-8443}:443"
      - "${NGINX_HTTP_PORT:-8081}:80"
    volumes:
      - ${DOCKER_DEPLOYMENT_PATH}/nginx:/etc/nginx
      - ${DOCKER_DEPLOYMENT_PATH}/nginx/logs:/var/log/nginx
      # - ./deployment/nginx/conf.d:/etc/nginx/conf.d
      # - "/home/hroland/developpements/homelab/home-lab-72200/deployment/nginx/conf.d:/etc/nginx/conf.d"
      # Add a health-check file for Nginx
      # - ./nginx-health-check.conf:/etc/nginx/conf.d/health-check.conf
      # - ./volumes/nginx/html:/usr/share/nginx/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-http.entrypoints=web"
      - "traefik.http.routers.nginx-http.rule=Host(`nginx.docker.local`)"
      - "traefik.http.services.nginx-service.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-http.service=nginx-service"
      - "traefik.docker.network=frontend"
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:80/health-check"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
    # healthcheck:
    #   test: ["CMD", "nginx", "-t"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s


  # --- Watchtower - Automatic Updates ---
  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_DOCKER_TAG:-latest}
    container_name: watchtower-${WATCHTOWER_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    depends_on:
      - dnsmasq
    dns:
      - 192.168.10.2
    networks:
      - backend-network
      - monitoring-network
      - homelab-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: --interval 3600 --cleanup --include-stopped #--include-volumes -http-api-metrics --http-api-token ${WATCHTOWER_SECRET_KEY} open-webui ollama
    environment:
      - WATCHTOWER_DEBUG=true
    labels:
      - "traefik.enable=false"
    # healthcheck:
    #   test: ["CMD", "ps", "aux"]
    #   interval: 60s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

  # --- YouTrack Issue Tracker ---
  youtrack-postgres:
    image: postgres:17.4
    container_name: youtrack-postgres-${YOUTRACK_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    depends_on:
      - dnsmasq
    dns:
      - 192.168.10.2
    environment:
      POSTGRES_USER: youtrack
      POSTGRES_PASSWORD: youtrack
      POSTGRES_DB: youtrack
    volumes:
      - ${DOCKER_VOLUMES_PATH}/youtrack/postgres/data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtrack"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  youtrack:
    image: jetbrains/youtrack:2025.1.71685
    container_name: youtrack-${YOUTRACK_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    depends_on:
      - youtrack-postgres
      - dnsmasq
    dns:
      - 192.168.10.2
    environment:
      YT_DATABASE_URL: jdbc:postgresql://youtrack-postgres-aistack:5432/youtrack
      YT_DATABASE_USER: youtrack
      YT_DATABASE_PASSWORD: youtrack
      # Add base URL for proper proxy configuration
      YOUTRACK_BASEURL: http://youtrack.docker.local
    volumes:
      - ${DOCKER_VOLUMES_PATH}/youtrack/data:/opt/youtrack/data
      - ${DOCKER_VOLUMES_PATH}/youtrack/conf:/opt/youtrack/conf
      - ${DOCKER_VOLUMES_PATH}/youtrack/logs:/opt/youtrack/logs
      - ${DOCKER_VOLUMES_PATH}/youtrack/backups:/opt/youtrack/backups
    networks:
      - frontend-network
      - backend-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.youtrack.entrypoints=web"
      - "traefik.http.routers.youtrack.rule=Host(`youtrack.docker.local`)"
      - "traefik.http.services.youtrack.loadbalancer.server.port=8080"
      - "traefik.docker.network=frontend"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/api/config"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # resources:
    #   limits:
    #     memory: 2G
    #     cpus: '2'
    #   reservations:
    #     memory: 1G
    #     cpus: '1'


volumes:
  ollama:
    name: ${DOCKER_VOLUMES_PATH}/ollama
  embedding-inference:
    name: ${DOCKER_VOLUMES_PATH}/embedding-inference
  open-webui:
    name: ${DOCKER_VOLUMES_PATH}/open-webui
  automatic1111:
    name: ${DOCKER_VOLUMES_PATH}/automatic1111
  # YouTrack volumes
  youtrack:
    name: ${DOCKER_VOLUMES_PATH}/youtrack

