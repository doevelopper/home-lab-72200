name: homelab

networks:
  # t3_proxy:
    # external: true
  homelab-network:
    name: homelab-network-default
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  frontend-network:
    name: homelab-network-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
  backend-network:
    name: homelab-network-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.20.0/24
  monitoring-network:
    name: homelab-network-monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.30.0/24

services:

  traefik:
    image: "traefik:v3.3.5"
    container_name: traefik-${TRAEFIK_CONTAINER_NAME:-aistack}
    environment:
      - TZ=Europe/Paris
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      # -- Enable the Traefik Dashboard (for debugging/visualization) --
      # !! SECURITY WARNING: This is insecure and open by default !!
      # !! In production, secure this with authentication/HTTPS/restrict access !!
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --accesslog.fields.names.StartUTC=drop
    ports:
      - "80:80"
      - "8080:8080" # The Web UI (enabled by --api.insecure=true)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`traefik.docker.local`)"
      - "traefik.http.routers.api.service=api@internal"
    healthcheck:
      test: traefik healthcheck --ping
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
      - homelab-network

  # --- Whoami Debugging Service ---
  whoami:
    image: traefik/whoami:${WHOAMI_DOCKER_TAG:-latest}
    container_name: whoami-${WHOAMI_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    networks:
      - backend-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami-http.entrypoints=web"
      - "traefik.http.routers.whoami-http.rule=Host(`whoami.docker.local`)"
      - "traefik.http.services.whoami-service.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami-http.service=whoami-service"
      - "traefik.docker.network=backend"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://whoami.docker.local:80"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --- Portainer --- 
  portainer:
    image: portainer/portainer-ce:${PORTAINER_DOCKER_TAG:-latest}
    container_name: portainer-${PORTAINER_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
      - homelab-network
    ports:
      - "9000:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./morphale/portainer/data:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-http.entrypoints=web"
      - "traefik.http.routers.portainer-http.rule=Host(`portainer.docker.local`)"
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer-http.service=portainer-service"
      - "traefik.docker.network=frontend"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://portainer.docker.local:9000"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:${NGINX_DOCKER_TAG:-latest}
    container_name: nginx-${NGINX_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
      - homelab-network
    ports:
      - "8081:80"
    volumes:
      # - "/opt/nginx/conf.d:/etc/nginx/conf.d"
      # - "/opt/nginx/html:/usr/share/nginx/html"
      # - "./deployment/static-content:/usr/share/nginx/html"
      # - "./deployment/nginx:/etc/nginx"
      - "/home/hroland/developpements/homelab/home-lab-72200/deployment/nginx/conf.d:/etc/nginx/conf.d"
      # - "/home/hroland/developpements/homelab/home-lab-72200/deployment/deployment/nginx/nginx.conf:/etc/nginx/nginx.conf"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-http.entrypoints=web"
      - "traefik.http.routers.nginx-http.rule=Host(`nginx.docker.local`)"
      - "traefik.http.services.nginx-service.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-http.service=nginx-service"
      - "traefik.docker.network=frontend"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://nginx.docker.local:80"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

# --- Watchtower - Automatic Updates ---
  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_DOCKER_TAG:-latest}
    container_name: watchtower-${WATCHTOWER_CONTAINER_NAME:-aistack}
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network
      - homelab-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: --interval 3600 --cleanup --include-stopped --include-volumes
    labels:
      - "traefik.enable=false"
      - "traefik.http.routers.watchtower-http.entrypoints=web"
      - "traefik.http.routers.watchtower-http.rule=Host(`watchtower.docker.local`)"
      - "traefik.http.services.watchtower-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.watchtower-http.service=watchtower-service"
      - "traefik.docker.network=backend"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://watchtower.docker.local:8080"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
