
services:
  # --- Traefik Reverse Proxy ---
  traefik:
    image: traefik:v3.3.5 # Use a specific version in production
    container_name: home-lab-${TRAEFIK_CONTAINER_NAME:-traefik}
    restart: ${TRAEFIK_RESTART:-unless-stopped}
    mem_limit: ${TRAEFIK_MEM_LIMIT:-200m}
    command:
      # -- Enable Docker Provider --
      - "--providers.docker=true"
      # -- Do NOT expose containers unless explicitly told to --
      - "--providers.docker.exposedbydefault=false"
      # -- Define the HTTP entrypoint --
      - "--entrypoints.web.address=:80"
      # -- Enable the Traefik Dashboard (for debugging/visualization) --
      # !! SECURITY WARNING: This is insecure and open by default !!
      # !! In production, secure this with authentication/HTTPS/restrict access !!
      - "--api.insecure=true"
      - "--api.dashboard=true"
      # -- Enable Access Logs --
      - "--accesslog=true"
      # -- Specify the network Traefik should use to connect to services by default --
      #    Although Traefik can often find the right network, being explicit is good.
      # - "--providers.docker.network=backend" # Optional, but can clarify intent
      - "--log.level=INFO" # (Set to DEBUG for more verbose logs if needed)

    ports:
      # -- Expose HTTP Entrypoint --
      - "80:80"
      # -- Expose Traefik Dashboard --
      # !! SECURITY WARNING: Accessible on host port 8080 without authentication !!
      - "8080:8080"

    networks:
      # Connect Traefik to the frontend network to receive external traffic
      - frontend
      # Connect Traefik to the backend network to forward traffic to backend services
      - backend
      # Traefik could optionally connect to monitoring if its API/metrics needed restriction
      # - monitoring

    volumes:
      # -- Mount Docker socket to allow Traefik to discover services --
      # !! SECURITY WARNING: Granting access to the Docker socket has security implications !!
      - "/var/run/docker.sock:/var/run/docker.sock:ro" # Read-only is safer

    labels:
      # Optional: You could expose the Traefik dashboard *through* Traefik itself
      # Requires setting up a router rule for it, usually done when securing it.
      # For this basic setup, direct port mapping (8080:8080) is simpler.
      - "traefik.enable=false" # We are not routing *to* Traefik itself via labels here
    healthcheck:
      # Use the Traefik ping endpoint enabled via "--ping=true" command
      # Note: This relies on the API being accessible (default on 8080)
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/ping"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s # Give Traefik some time to start up

  

  # --- Sample Nginx Application ---
  nginx:
    image: nginx:${NGINX_DOCKER_TAG:-latest}
    container_name: home-lab-${NGINX_CONTAINER_NAME:-nginx}
    restart: ${NGINX_RESTART:-unless-stopped}  
    networks:
      # Only connect Nginx to the backend network. Traefik will reach it there.
      - backend
    # Nginx doesn't need ports exposed directly to the host. Traefik handles that.
    # ports:
    #  - "80" # Only exposes internally within Docker network
    volumes:
      # Mount your custom config into the default directory Nginx reads from
      - ./nginx/conf.d/traefik-dashboard.conf:/etc/nginx/conf.d/default.conf:ro # Read-only is good practice
      # Optional: Mount default content if you still want the welcome page accessible
      # Note: The default nginx image already contains this, but mounting
      # the config might overwrite how it's served unless specified like above.
      # - ./html:/usr/share/nginx/html:ro
      # - ./nginx:/etc/nginx:ro # Read-only is good practice

    labels:
      # -- Enable Traefik for this service --
      - "traefik.enable=true"

      # -- Define the HTTP Router --
      # This router will listen on the 'web' entrypoint (port 80)
      - "traefik.http.routers.nginx-http.entrypoints=web"
      # Route requests with the Host header "nginx.localhost"
      - "traefik.http.routers.nginx-http.rule=Host(`nginx.local`)"

      # -- Define the Service --
      # Tell Traefik that the Nginx container listens on port 80
      - "traefik.http.services.nginx-service.loadbalancer.server.port=80"

      # -- Link the Router to the Service --
      - "traefik.http.routers.nginx-http.service=nginx-service"

      # -- Explicitly tell Traefik to use the 'backend' network for this service --
      #    Required if the container is connected to multiple networks shared with Traefik.
      #    Good practice even if only connected to one shared network.
      - "traefik.docker.network=backend"
## crash the dashboard http://nginx.local/dashboard/#/ 404 page not found
    # healthcheck:
    #   # Check if Nginx is responding on its internal port 80
    #   test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80"]
    #   interval: 15s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 5s

  # --- Whoami Debugging Service ---
  whoami:
    image: traefik/whoami:${WHOAMI_DOCKER_TAG:-latest}
    container_name: home-lab-${WHOAMI_CONTAINER_NAME:-whoami}
    restart: unless-stopped
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami-http.entrypoints=web"
      - "traefik.http.routers.whoami-http.rule=Host(`whoami.local`)"
      - "traefik.http.services.whoami-service.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami-http.service=whoami-service"
      - "traefik.docker.network=backend"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --- Watchtower - Automatic Updates ---
  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_DOCKER_TAG:-latest}
    container_name: home-lab-${WATCHTOWER_CONTAINER_NAME:-watchtower}
    restart: ${WATCHTOWER_RESTART:-unless-stopped}

    # Run checks every 6 hours (21600 seconds)
    command: --interval 21600 --cleanup
    networks:
        # Does not need to be on frontend/backend networks usually
        # Placing on monitoring network for logical separation
        - monitoring
    volumes:
        # -- Mount Docker socket to allow Watchtower to manage containers --
        # !! MAJOR SECURITY WARNING: Granting write access to the Docker socket !!
        # !! allows this container to control *all* other containers.         !!
        - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
      # Watchtower does not expose a web service, disable Traefik
      - "traefik.enable=false"
      # Optional: You could expose Watchtower's API through Traefik if needed
      # - "traefik.http.routers.watchtower-http.entrypoints=web"
      # - "traefik.http.routers.watchtower-http.rule=Host(`watchtower.local`)"
      # - "traefik.http.services.watchtower-service.loadbalancer.server.port=8080"
      # - "traefik.http.routers.watchtower-http.service=watchtower-service"
      # - "traefik.docker.network=monitoring" # Optional, if you want to restrict access 

  # --- n8n Workflow Automation ---
  n8n:
    # Use the official n8n image
    image: n8nio/n8n:${N8N_DOCKER_TAG:-latest}
    container_name: home-lab-${N8N_CONTAINER_NAME:-n8n}
    restart: ${N8N_RESTART:-unless-stopped}
    networks:
      - backend # Needs to be reached by Traefik
    volumes:
      # Mount a volume for persistent n8n data (workflows, credentials, etc.)
      - ./n8n_data:/home/node/.n8n
    environment:
      # Set timezone, adjust as needed
      - TZ=Etc/UTC
      # Other n8n config via ENV variables can go here (e.g., database, execution settings)
      - N8N_SECURE_COOKIE=false # Optional: Set to true for secure cookies
      # Basic auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-user}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-password}
    labels:
      - "traefik.enable=true"
      # Router definition
      - "traefik.http.routers.n8n-http.entrypoints=web"
      - "traefik.http.routers.n8n-http.rule=Host(`n8n.local`)"
      - "traefik.http.routers.n8n-http.service=n8n-service"
      # Service definition (n8n default port is 5678)
      - "traefik.http.services.n8n-service.loadbalancer.server.port=5678"
      # Network definition
      - "traefik.docker.network=backend"
    # healthcheck: ### NOT WORKING WHEN ENABLED
    #   # n8n has a healthcheck endpoint
    #   test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5678/healthz"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 55s


  # --- Ollama LLM Server ---
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: home-lab-${OLLAMA_CONTAINER_NAME:-ollama}
    restart: ${OLLAMA_RESTART:-unless-stopped}
    hostname: "ollama"
    networks:
      # Only needs backend access for Open WebUI (and potentially n8n) to connect
      - backend
    volumes:
      # Mount a volume for persistent Ollama models
      - ./ollama_data:/root/.ollama
      - /etc/localtime:/etc/localtime:ro # Optional: Mount host's localtime for consistent timestamps
      - /etc/timezone:/etc/timezone:ro
    environment:  
      # Set timezone, adjust as needed
      - TZ=Etc/UTC
      # Optional: Set Ollama's default model (e.g., "llama2")
      # - OLLAMA_DEFAULT_MODEL=llama2
      # Optional: Set Ollama's default port (default is 11434)
      # - OLLAMA_PORT=11434 
    # --- GPU Acceleration (Optional - Uncomment and configure ONE block if needed) ---
    # Ensure you have the correct drivers and Docker runtime installed on the host.
    # == NVIDIA ==
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # or 'all'
              capabilities: [gpu]
    # == AMD (Experimental - may require different base image or drivers) ==
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    # security_opt:
    #   - seccomp:unconfined
    # group_add:
    #   - video
    # --- End GPU ---
    labels:
      # Ollama is an API, not exposing directly via Traefik usually
      - "traefik.enable=false"
    # healthcheck:
    #   # Check if the API is responding on its default port 11434
    #   test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:11434"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 45s # Give it time to start, especially if loading models

  # --- Open WebUI for Ollama ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OLLAMA_WEBUI_DOCKER_TAG:-main}
    container_name: home-lab-${OLLAMA_WEBUI_CONTAINER_NAME:-ollama-webui}
    restart: ${OLLAMA_WEBUI_RESTART:-unless-stopped}
    networks:
      - backend # Needs to reach Ollama and be reached by Traefik
    volumes:
      # Mount a volume for persistent Open WebUI data/config
      - ./openwebui_data:/app/backend/data
    environment:
      # CRITICAL: Tell Open WebUI where the Ollama API is. Use the service name.
      - OLLAMA_BASE_URL=http://ollama:11434
      - TZ=Etc/UTC
      # Optional: Enable/disable features
      # - WEBUI_SECRET_KEY= # Generate a secure random key for production
      # - WEBUI_TELEMETRY=false # Disable telemetry if desired
    depends_on:
      # Wait for Ollama to be started (though not necessarily healthy yet)
      # Use healthcheck condition for stricter startup order if needed
      ollama:
        condition: service_started
      # Optional: Wait for Traefik if experiencing race conditions on first start
      # traefik:
      #   condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Router definition
      - "traefik.http.routers.webui-http.entrypoints=web"
      - "traefik.http.routers.webui-http.rule=Host(`webui.local`)"
      - "traefik.http.routers.webui-http.service=webui-service"
      # Service definition (Open WebUI default port inside container is 8080)
      # Note: This is the *internal* port, no conflict with Traefik host port mapping
      - "traefik.http.services.webui-service.loadbalancer.server.port=8080"
      # Network definition
      - "traefik.docker.network=backend"
    # healthcheck:
    #   # Check if the WebUI is responding on its internal port 8080
    #   test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 45s


# --- Define Custom Networks ---
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.10.0/24
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.20.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.30.0/24

