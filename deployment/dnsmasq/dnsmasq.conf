# DNS Configuration
domain-needed
bogus-priv
no-resolv
no-hosts

# Upstream DNS Servers (Google DNS)
server=8.8.8.8
server=8.8.4.4

# Local domain
local=/docker.local/

# DNS Records for your services
address=/traefik.docker.local/192.168.10.4
address=/whoami.docker.local/192.168.10.5
address=/portainer.docker.local/192.168.10.6
address=/nginx.docker.local/192.168.10.7
address=/watchtower.docker.local/192.168.10.8

# Enable DNS query logging for debugging
log-queries
log-facility=-