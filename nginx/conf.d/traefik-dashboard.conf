# /path/to/your/nginx-proxy-dashboard.conf

server {
    listen 80;
    # Optional: You could use a specific server name if you route
    # differently via Traefik later. For now, it listens on its default.
    # server_name dashboard.internal;

    location / {
        # Proxy requests to the Traefik container's API port (8080)
        # We use the service name 'traefik' because Docker's internal DNS
        # will resolve this to the traefik container's IP on the shared 'backend' network.
        proxy_pass http://traefik:8080;

        # Set headers to pass along original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Adjust timeouts if needed
        # proxy_connect_timeout       60s;
        # proxy_send_timeout          60s;
        # proxy_read_timeout          60s;
    }

    # You might still want to serve the default page on a different path
    # or remove this if the *only* purpose of this nginx is proxying.
    location /nginx-welcome {
         root   /usr/share/nginx/html;
         index  index.html index.htm;
         try_files $uri $uri/ /index.html;
    }
}